   <g id="text_1">
    <text style="fill: #25364a; font: 700 14px 'Heiti TC'; text-anchor: middle" x="259.2" y="23.76" transform="rotate(-0 259.2 23.76)">智能建造关键技术识别与发展研判框架</text>
   </g>
   <g id="text_2">
    <text style="fill: #25364a; font: 700 10.5px 'Heiti TC'; text-anchor: middle" x="259.2" y="71.234414" transform="rotate(-0 259.2 71.234414)">第1—2章  研究问题与理论基础</text>
   </g>
   <g id="text_3">
    <text style="fill: #25364a; font: 9px 'Heiti TC'; text-anchor: middle" x="259.2" y="98.154141" transform="rotate(-0 259.2 98.154141)">技术范围与研究问题｜生命周期、知识组合与社会网络</text>
   </g>
   <g id="text_4">
    <text style="fill: #25364a; font: 700 10.5px 'Heiti TC'; text-anchor: middle" x="259.2" y="154.118906" transform="rotate(-0 259.2 154.118906)">第3章  发展态势与生命周期阶段分析</text>
   </g>
   <g id="text_5">
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(155.7 188.533863)">专利与文献 → 总体态势 → 生命周期解释与阶段比较</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(154.927969 202.174418)">观察窗口：2010—2014 / 2015—2019 / 2020—2025</text>
   </g>
   <g id="text_6">
    <text style="fill: #25364a; font: 700 10.5px 'Heiti TC'; text-anchor: middle" x="259.2" y="265.639336" transform="rotate(-0 259.2 265.639336)">第4章  关键技术识别与动态演化分析</text>
   </g>
   <g id="text_7">
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(168.610781 305.149746)">分阶段IPC共现网络 → 节点影响力及跨期变化</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(254.7 318.374965)">↓</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(169.978359 331.778848)">关键节点与专利文本映射 → BERTopic九主题</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(254.7 345.004066)">↓</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(162.45 358.303535)">演化规律、主题关联及来源边界 → 研究证据汇总</text>
   </g>
   <g id="text_8">
    <text style="fill: #25364a; font: 700 10.5px 'Heiti TC'; text-anchor: middle" x="259.2" y="426.941484" transform="rotate(-0 259.2 426.941484)">第5章  证据约束下的多智能体发展研判</text>
   </g>
   <g id="text_9">
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(160.2 472.999219)">证据组织与量化分析 → 演化分析 → 发展命题生成</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(254.7 486.224438)">↓</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(175.473281 499.47982)">独立双审查：反向审查 + 工程审查 → 裁决</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(254.7 512.705039)">↓</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(179.050078 526.584586)">接受 / 局部修订与有限复审 / 降级 / 暂缓</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(259.2 539.809805)"/>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(149.468906 553.213687)">LangGraph + Harness：校验、日志、版本及终止条件</text>
    <text style="fill: #25364a; font: 9px 'Heiti TC'" transform="translate(173.7 566.438906)">发展路径、证据一致性评价与技术发展建议</text>
   </g>
   <g id="text_10">
    <text style="fill: #25364a; font: 700 10.5px 'Heiti TC'; text-anchor: middle" x="259.2" y="641.474414" transform="rotate(-0 259.2 641.474414)">第6章  结论与展望</text>
   </g>
   <g id="text_11">
    <text style="fill: #25364a; font: 9px 'Heiti TC'; text-anchor: middle" x="259.2" y="668.354062" transform="rotate(-0 259.2 668.354062)">回应研究问题 → 总结贡献与局限 → 后续研究方向</text>
   </g>
   <g id="text_12">
    <text style="fill: #7d8794; font: 8px 'Heiti TC'; text-anchor: start" x="25.2" y="711.36" transform="rotate(-0 25.2 711.36)">注：框架表示研究组织；未来路径为条件性判断，评价实测范围见正文。</text>
   </g>
  </g>
